
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg-page:#F5F3EE;--bg-card:#FFFFFF;--bg-surf:#EDE9E1;--bg-deep:#E4DFD5;
--ca:#4F6EF7;--ca2:rgba(79,110,247,0.1);
--cb:rgba(0,0,0,0.10);--cbs:rgba(0,0,0,0.14);
--tx:#1A1916;--mu:#6B6760;--hi:#9E9A93;
--r:8px;--rl:12px
}
body{font-family:var(--font-sans);color:var(--tx);font-size:14px;background:var(--bg-page)}
.app{display:flex;flex-direction:column;min-height:780px;background:var(--bg-page)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--cb);background:var(--bg-card);flex-wrap:wrap;gap:8px}
.logo{font-size:15px;font-weight:500;letter-spacing:-0.3px;color:var(--tx)}.logo span{color:var(--ca)}
.tabs{display:flex;gap:3px;background:var(--bg-surf);border-radius:var(--r);padding:3px;overflow-x:auto}
.tab{padding:5px 10px;border:none;background:transparent;border-radius:6px;font-size:11px;cursor:pointer;color:var(--mu);white-space:nowrap;transition:all .15s}
.tab.active{background:var(--bg-card);color:var(--tx);font-weight:500}
.add-btn{display:flex;align-items:center;gap:5px;padding:6px 11px;background:var(--ca);color:#fff;border:none;border-radius:var(--r);font-size:12px;cursor:pointer;font-weight:500}
.notif-area{padding:0 14px;background:var(--bg-page)}
.notif{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#FFF8E6;border:1px solid #E8C97A;border-radius:var(--r);margin-top:8px;font-size:12px;color:#7A5C00}
.notif-close{margin-left:auto;cursor:pointer;background:none;border:none;color:#7A5C00;font-size:16px}
.body{display:flex;flex:1;overflow:hidden;background:var(--bg-page)}
.sidebar{width:200px;flex-shrink:0;border-right:1px solid var(--cb);padding:12px 10px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;background:var(--bg-card)}
.sidebar.hidden{display:none}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-title{font-size:11px;font-weight:500;color:var(--tx)}
.nav-btn{background:none;border:none;cursor:pointer;color:var(--mu);padding:2px 4px;border-radius:4px;font-size:13px}
.nav-btn:hover{background:var(--bg-surf)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cdl{font-size:9px;color:var(--hi);text-align:center;padding:2px 0}
.cd{font-size:10px;text-align:center;padding:3px 1px;border-radius:3px;cursor:pointer;color:var(--mu);position:relative}
.cd:hover{background:var(--bg-surf)}
.cd.today{background:var(--ca);color:#fff;font-weight:500}
.cd.has-task::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--ca)}
.cd.today::after{background:#fff}
.cd.selected{background:var(--ca2);color:var(--ca)}
.cd.om{opacity:.3}
.sm{background:var(--bg-surf);border-radius:var(--r);padding:8px 10px}
.sm-label{font-size:10px;color:var(--mu);margin-bottom:3px}
.sm-val{font-size:17px;font-weight:500;color:var(--tx)}
.pbar{flex:1;height:4px;background:var(--bg-deep);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:var(--ca);border-radius:3px}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-width:0;background:var(--bg-page)}
.chdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;border-bottom:1px solid var(--cb);background:var(--bg-card);flex-wrap:wrap;gap:6px}
.ctitle{font-size:13px;font-weight:500;color:var(--tx)}
.tlist{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:7px;background:var(--bg-page)}
.tc{background:var(--bg-card);border:1px solid var(--cb);border-radius:var(--rl);padding:10px 12px}
.tc:hover{border-color:var(--cbs)}
.thdr{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.tck{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--cbs);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;background:none}
.tck.done{background:var(--ca);border-color:var(--ca)}
.tck.done::after{content:'';width:4px;height:7px;border-right:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(45deg) translate(-1px,-1px)}
.tmain{flex:1;min-width:0}
.tname{font-size:12px;font-weight:500;margin-bottom:3px;color:var(--tx)}
.tname.done{text-decoration:line-through;color:var(--hi)}
.tmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bdg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:500}
.bw{background:var(--bg-surf);color:var(--mu)}
.bp{background:rgba(79,110,247,.12);color:var(--ca)}
.bd{background:#E6F4EA;color:#2D7A3A}
.tact{display:flex;gap:4px;flex-shrink:0}
.ibtn{width:24px;height:24px;border:none;background:none;cursor:pointer;color:var(--hi);border-radius:5px;display:flex;align-items:center;justify-content:center}
.ibtn:hover{background:var(--bg-surf);color:var(--tx)}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ppct{font-size:10px;color:var(--mu);min-width:26px;text-align:right}
.notes{font-size:11px;color:var(--mu);background:var(--bg-surf);border-radius:5px;padding:6px 8px;line-height:1.5;white-space:pre-wrap;cursor:pointer}
.notes.empty{color:var(--hi);font-style:italic}
.empty-st{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;color:var(--hi);gap:8px}
.mpanel{position:absolute;top:0;right:0;width:300px;height:100%;background:var(--bg-card);border-left:1px solid var(--cb);display:flex;flex-direction:column;z-index:50;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.mpanel.open{transform:translateX(0)}
.minner{flex:1;overflow-y:auto;padding:16px 14px 0}
.mtbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mtitle{font-size:13px;font-weight:500;color:var(--tx)}
.mcls{width:26px;height:26px;border:none;background:none;cursor:pointer;color:var(--mu);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:17px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fl{font-size:11px;color:var(--mu);font-weight:500}
.fi{padding:6px 8px;border:1px solid var(--cb);border-radius:var(--r);font-size:12px;background:var(--bg-card);color:var(--tx);width:100%}
.fi:focus{outline:none;border-color:var(--ca)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vrow{display:flex;gap:5px}.vrow .fi{flex:1}
.mic{width:32px;height:32px;border:1px solid var(--cb);border-radius:var(--r);background:var(--bg-surf);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mu);flex-shrink:0}
.mic.on{background:rgba(220,50,50,.08);border-color:rgba(220,50,50,.4);color:#dc3232;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.rw{display:flex;align-items:center;gap:8px}
.rw input[type=range]{flex:1}
.mftr{padding:12px 14px;border-top:1px solid var(--cb);display:flex;flex-direction:column;gap:8px;background:var(--bg-card)}
.btn-save-big{width:100%;padding:11px;background:var(--ca);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-save-big:hover{opacity:.9}
.bcnl{padding:8px;background:var(--bg-surf);border:1px solid var(--cb);border-radius:var(--r);font-size:12px;cursor:pointer;color:var(--mu);width:100%;text-align:center}

/* SALES */
.sales-outer{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;align-items:center;background:var(--bg-page)}
.sales-inner{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}

/* PROJECT */
.proj-outer{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;align-items:center;background:var(--bg-page)}
.proj-inner{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
.proj-card{background:var(--bg-card);border:1px solid var(--cbs);border-radius:var(--rl);overflow:hidden}
.proj-card-head{display:flex;align-items:flex-start;justify-content:space-between;padding:13px 14px 11px;border-bottom:1px solid var(--cb);gap:10px}
.proj-card-title{font-size:13px;font-weight:500;color:var(--tx);flex:1}
.proj-badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.proj-badge.active{background:rgba(79,110,247,.12);color:var(--ca)}
.proj-badge.done{background:#E6F4EA;color:#2D7A3A}
.proj-badge.hold{background:var(--bg-surf);color:var(--mu)}
.proj-dates{display:flex;gap:12px;padding:9px 14px;border-bottom:1px solid var(--cb);background:var(--bg-surf)}
.proj-date-item{display:flex;flex-direction:column;gap:2px}
.proj-date-lbl{font-size:9px;color:var(--hi);font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.proj-date-val{font-size:11px;color:var(--tx);font-weight:500}
.proj-progress-wrap{padding:10px 14px;border-bottom:1px solid var(--cb)}
.proj-progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.proj-progress-lbl{font-size:11px;color:var(--mu)}
.proj-progress-pct{font-size:13px;font-weight:500;color:var(--ca)}
.proj-bar-track{height:8px;background:var(--bg-surf);border-radius:4px;overflow:hidden}
.proj-bar-fill{height:100%;border-radius:4px;background:var(--ca);transition:width .4s ease}
.proj-tasks-section{padding:0}
.proj-tasks-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--cb)}
.proj-tasks-lbl{font-size:10px;font-weight:500;color:var(--mu)}
.proj-task-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--cb)}
.proj-task-row:last-child{border-bottom:none}
.proj-task-row:nth-child(even){background:var(--bg-page)}
.proj-task-check{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--cbs);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:none}
.proj-task-check.done{background:var(--ca);border-color:var(--ca)}
.proj-task-check.done::after{content:'';width:4px;height:6px;border-right:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(45deg) translate(-1px,-1px)}
.proj-task-name{flex:1;font-size:12px;color:var(--tx)}
.proj-task-name.done{text-decoration:line-through;color:var(--hi)}
.proj-task-date{font-size:10px;color:var(--hi);white-space:nowrap}
.proj-task-pct{font-size:10px;color:var(--mu);min-width:28px;text-align:right}
.proj-add-task{display:flex;align-items:center;gap:6px;padding:8px 14px;cursor:pointer;color:var(--ca);font-size:11px;border-top:1px solid var(--cb)}
.proj-add-task:hover{background:var(--ca2)}
.proj-actions{display:flex;justify-content:flex-end;gap:8px;padding:9px 14px;border-top:1px solid var(--cb)}
.proj-linked{padding:8px 14px;border-top:1px solid var(--cb)}
.proj-linked-lbl{font-size:10px;font-weight:500;color:var(--mu);margin-bottom:6px}
.proj-linked-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--ca2);border-radius:8px;font-size:10px;color:var(--ca);margin:2px}
.proj-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:var(--hi);gap:8px;text-align:center}

/* PROJECT 모달 */
.proj-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;align-items:center;justify-content:center;padding:20px}
.proj-modal-bg.open{display:flex}
.proj-modal{background:var(--bg-card);border-radius:var(--rl);width:100%;max-width:460px;max-height:90vh;overflow-y:auto;border:1px solid var(--cbs)}
.proj-modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--cb)}
.proj-modal-title{font-size:13px;font-weight:500;color:var(--tx)}
.proj-modal-body{padding:16px}
.proj-modal-foot{padding:10px 16px;border-top:1px solid var(--cb);display:flex;gap:8px;justify-content:flex-end}
.month-nav{display:flex;align-items:center;justify-content:center;gap:16px;background:var(--bg-card);border-radius:var(--r);padding:8px 14px;border:1px solid var(--cb)}
.mnbtn{background:none;border:none;cursor:pointer;color:var(--mu);font-size:22px;line-height:1;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.mnbtn:hover{background:var(--bg-surf);color:var(--tx)}
.mlbl{font-size:14px;font-weight:500;min-width:60px;text-align:center;color:var(--tx)}
.sum-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sum-chip{background:var(--bg-card);border-radius:var(--r);padding:10px 12px;text-align:center;border:1px solid var(--cb)}
.sum-chip-lbl{font-size:10px;color:var(--mu);margin-bottom:4px}
.sum-chip-val{font-size:15px;font-weight:500;color:var(--tx)}
.bc{background:var(--bg-card);border:1px solid var(--cbs);border-radius:var(--rl);overflow:hidden}
.bc-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--cbs)}
.bc-name{font-size:13px;font-weight:500;flex:1;color:var(--tx)}
.bc-pct-badge{font-size:12px;font-weight:500;padding:3px 9px;border-radius:10px}
.bc-pct-badge.over{background:#E6F4EA;color:#2D7A3A}
.bc-pct-badge.near{background:#FFF3CD;color:#8A6200}
.bc-pct-badge.under{background:#FDECEA;color:#B02A1A}
.bc-bar-wrap{padding:10px 14px;border-bottom:1px solid var(--cbs)}
.bc-bar-labels{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.bc-bar-lbl{font-size:10px;color:var(--mu)}
.bc-bar-track{height:7px;background:var(--bg-surf);border-radius:4px;overflow:hidden}
.bc-bar-fill{height:100%;border-radius:4px}
.bc-row{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--cb)}
.bc-row:last-child{border-bottom:none}
.bc-row-label{font-size:11px;color:var(--mu);flex:1}
.bc-row-val{font-size:12px;font-weight:500;text-align:right;color:var(--tx)}
.bc-row-unit{font-size:10px;color:var(--hi);margin-left:3px}
.bc-edit-trigger{display:flex;align-items:center;justify-content:center;padding:9px;border-top:1px solid var(--cbs);cursor:pointer;gap:6px;font-size:11px;color:var(--ca);background:var(--bg-card)}
.bc-edit-trigger:hover{background:var(--ca2)}
.edit-panel{padding:12px 14px;border-top:1px solid var(--cbs);background:var(--bg-surf)}
.edit-input{padding:7px 8px;border:1px solid var(--cb);border-radius:var(--r);font-size:12px;background:var(--bg-card);color:var(--tx);width:100%}
.edit-input:focus{outline:none;border-color:var(--ca)}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.edit-field{display:flex;flex-direction:column;gap:3px}
.edit-label{font-size:10px;color:var(--mu);font-weight:500}
.auto-result{border-radius:var(--r);padding:8px 10px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.auto-result.actual{background:var(--ca2)}
.auto-result.goal{background:var(--bg-deep)}
.chart-box{background:var(--bg-card);border:1px solid var(--cbs);border-radius:var(--rl);padding:12px 14px}
.leg-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mu)}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.ai-box{background:var(--bg-surf);padding:10px 12px;font-size:12px;line-height:1.7;border-left:2px solid var(--ca);color:var(--tx)}
@keyframes dp{0%,100%{opacity:.2}50%{opacity:1}}
</style>

<div class="app" id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="logo">Work<span>Flow</span></div>
      <div style="width:1px;height:14px;background:var(--cb)"></div>
      <div style="font-size:11px;color:var(--mu)" id="today-label"></div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <div class="tabs">
        <button class="tab active" onclick="sv('board')">업무</button>
        <button class="tab" onclick="sv('timeline')">타임라인</button>
        <button class="tab" onclick="sv('project')">프로젝트</button>
        <button class="tab" onclick="sv('sales')">해외매출</button>
        <button class="tab" onclick="sv('report')">보고서</button>
      </div>
      <button class="add-btn" onclick="openModal()">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        새 업무
      </button>
    </div>
  </div>
  <div class="notif-area" id="notif-area"></div>
  <div class="body">
    <div class="sidebar" id="sidebar">
      <div>
        <div class="cal-hdr"><span class="cal-title" id="cal-month-label"></span><div style="display:flex;gap:2px"><button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button><button class="nav-btn" onclick="changeMonth(1)">&#8250;</button></div></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="sm"><div class="sm-label">오늘 업무</div><div class="sm-val" id="stat-total">0</div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          <div class="sm"><div class="sm-label">완료</div><div class="sm-val" style="color:#2D7A3A" id="stat-done">0</div></div>
          <div class="sm"><div class="sm-label">진행</div><div class="sm-val" style="color:var(--ca)" id="stat-prog">0</div></div>
        </div>
        <div class="sm"><div class="sm-label">진행률</div><div style="display:flex;align-items:center;gap:8px;margin-top:5px"><div class="pbar" style="flex:1;height:5px"><div class="pfill" id="stat-bar" style="width:0%"></div></div><span style="font-size:10px;color:var(--mu)" id="stat-pct">0%</span></div></div>
        <button style="width:100%;justify-content:center;display:flex;align-items:center;gap:5px;padding:6px 10px;background:var(--bg-surf);color:var(--tx);border:1px solid var(--cb);border-radius:var(--r);font-size:11px;cursor:pointer" onclick="sv('report')"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>보고서</button>
      </div>
    </div>
    <div class="content" id="content-area">
      <div class="chdr"><div class="ctitle" id="content-title">오늘의 업무</div><select class="fi" style="width:auto;padding:4px 8px;font-size:11px" onchange="filterTasks(this.value)"><option value="all">전체</option><option value="대기">대기</option><option value="진행 중">진행 중</option><option value="완료">완료</option></select></div>
      <div class="tlist" id="task-list"></div>
      <div class="mpanel" id="modal-panel">
        <div class="minner">
          <div class="mtbar"><div class="mtitle" id="modal-title">새 업무 추가</div><button class="mcls" onclick="closeModal()">&#215;</button></div>
          <div class="fg"><div class="fl">업무명</div><div class="vrow"><input class="fi" id="inp-name" placeholder="업무 내용을 입력하세요"/><button class="mic" id="mic-btn" onclick="toggleVoice('inp-name')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="21" x2="12" y2="17"/><line x1="8" y1="21" x2="16" y2="21"/></svg></button></div></div>
          <div class="frow"><div class="fg"><div class="fl">상태</div><select class="fi" id="inp-status"><option>대기</option><option>진행 중</option><option>완료</option></select></div><div class="fg"><div class="fl">마감일</div><input class="fi" type="date" id="inp-date"/></div></div>
          <div class="fg"><div class="fl">진행률 — <span id="pct-label">0</span>%</div><div class="rw"><input type="range" min="0" max="100" step="5" value="0" id="inp-pct" oninput="document.getElementById('pct-label').textContent=this.value"/></div></div>
          <div class="fg"><div class="fl">특이사항</div><div class="vrow"><textarea class="fi" id="inp-notes" rows="3" placeholder="메모, 이슈, 진행 내용..." style="resize:none;line-height:1.5"></textarea><button class="mic" id="mic-btn2" onclick="toggleVoice('inp-notes')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="21" x2="12" y2="17"/><line x1="8" y1="21" x2="16" y2="21"/></svg></button></div></div>
        </div>
        <div class="mftr">
          <button class="btn-save-big" id="save-btn" onclick="saveTask()"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>업무 등록</button>
          <button class="bcnl" onclick="closeModal()">취소</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const SK='wf_tasks_v2',SALSK='wf_sales_v5',PROJK='wf_projects_v1';
let tasks=[],editId=null,filterStatus='all',viewMonth=new Date(),selectedDate=null;
let recognition=null,listeningField=null,curView='board';
let salesMonth=new Date().getMonth(),sChart=null,openEditKey=null;
let projects=[];
let editProjId=null,editPTaskId=null,editPTaskProjId=null;
const BKEYS=['nagoya','tokyo','ny'];
const BI={nagoya:{name:'나고야',color:'#4F6EF7'},tokyo:{name:'도쿄',color:'#1D9E75'},ny:{name:'뉴욕',color:'#D85A30'}};
const MN=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function mkSales(){const d={};const cfg={nagoya:{qty:[15,35],price:[8,12]},tokyo:{qty:[25,55],price:[14,20]},ny:{qty:[20,45],price:[28,38]}};BKEYS.forEach(k=>{d[k]={months:[]};for(let m=0;m<12;m++){const qty=rnd(cfg[k].qty[0],cfg[k].qty[1]),price=rnd(cfg[k].price[0],cfg[k].price[1]);const gQty=rnd(cfg[k].qty[0],cfg[k].qty[1]+5),gPrice=rnd(cfg[k].price[0],cfg[k].price[1]+2);d[k].months.push({qty,price,actual:qty*price,gQty,gPrice,goal:gQty*gPrice});}});return d;}
function loadSales(){try{const d=JSON.parse(localStorage.getItem(SALSK));if(d&&d.nagoya&&d.nagoya.months[0].gQty!==undefined)return d;}catch(e){}const d=mkSales();localStorage.setItem(SALSK,JSON.stringify(d));return d;}
function saveSales(d){localStorage.setItem(SALSK,JSON.stringify(d));}
function load(){try{tasks=JSON.parse(localStorage.getItem(SK))||[];}catch(e){tasks=[];}if(!tasks.length)seed();try{projects=JSON.parse(localStorage.getItem(PROJK))||[];}catch(e){projects=[];}}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function seed(){const t=todayStr();tasks=[{id:1,name:'나고야 2분기 전략 보고서',status:'진행 중',pct:65,date:t,notes:'데이터 시각화 추가 예정'},{id:2,name:'뉴욕 미팅 자료 준비',status:'완료',pct:100,date:t,notes:'PPT 완료'},{id:3,name:'도쿄 마케팅 캠페인',status:'대기',pct:0,date:t,notes:''}];save();}
function save(){localStorage.setItem(SK,JSON.stringify(tasks));}
function saveProjects(){localStorage.setItem(PROJK,JSON.stringify(projects));}
function setTodayLabel(){const d=new Date();const ds=['일','월','화','수','목','금','토'];document.getElementById('today-label').textContent=d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' ('+ds[d.getDay()]+')';}
function getDD(){return selectedDate||todayStr();}
function getDT(){const dt=getDD();return tasks.filter(t=>t.date===dt&&(filterStatus==='all'||t.status===filterStatus));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtM(v){return v>=100000000?(v/100000000).toFixed(1)+'억원':v>=10000?(v/10000).toFixed(0)+'만원':v.toLocaleString()+'원';}
function fmtW(v){return Number(v).toLocaleString()+'원';}

function render(){
  renderStats();
  if(curView==='board')renderTasks();
  else if(curView==='timeline')renderTimeline();
  else if(curView==='project')renderProject();
  else if(curView==='sales')renderSales();
  else if(curView==='report')renderReport();
  renderCal();renderNotifs();
  const tt=document.getElementById('content-title');
  if(tt){const map={sales:'해외 지점 매출',report:'일일 보고서',timeline:'타임라인',project:'프로젝트 관리'};tt.textContent=map[curView]||(getDD()===todayStr()?'오늘의 업무':getDD().replace(/-/g,'.')+' 업무');}
}

function renderStats(){const dt=getDD();const day=tasks.filter(t=>t.date===dt);const done=day.filter(t=>t.status==='완료').length;const prog=day.filter(t=>t.status==='진행 중').length;document.getElementById('stat-total').textContent=day.length;document.getElementById('stat-done').textContent=done;document.getElementById('stat-prog').textContent=prog;const avg=day.length?Math.round(day.reduce((s,t)=>s+Number(t.pct),0)/day.length):0;document.getElementById('stat-bar').style.width=avg+'%';document.getElementById('stat-pct').textContent=avg+'%';}

function taskCard(t){
  const bc=t.status==='완료'?'bd':t.status==='진행 중'?'bp':'bw';
  const dc=t.status==='완료'?'done':'';const cc=t.status==='완료'?'done':'';
  const nh=t.notes?`<div class="notes">${esc(t.notes)}</div>`:`<div class="notes empty" onclick="editTask(${t.id})">메모 추가...</div>`;
  const projLink=(()=>{for(const p of projects){for(const pt of(p.tasks||[])){if(pt.linkTaskId&&String(pt.linkTaskId)===String(t.id)){return`<span style="font-size:10px;color:var(--ca);background:var(--ca2);padding:1px 6px;border-radius:6px">📁 ${esc(p.name)}</span>`;}}}return'';})();
  return`<div class="tc"><div class="thdr"><div class="tck ${cc}" onclick="toggleDone(${t.id})"></div><div class="tmain"><div class="tname ${dc}">${esc(t.name)}</div><div class="tmeta"><span class="bdg ${bc}">${t.status}</span>${t.date?`<span style="font-size:10px;color:var(--hi)">${t.date.slice(5).replace('-','/')}</span>`:''} ${projLink}</div></div><div class="tact"><button class="ibtn" onclick="editTask(${t.id})"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="ibtn" onclick="deleteTask(${t.id})" style="color:#B02A1A"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button></div></div><div class="prow"><div class="pbar"><div class="pfill" style="width:${t.pct}%"></div></div><span class="ppct">${t.pct}%</span></div>${nh}</div>`;
}

function renderTasks(){
  const list=document.getElementById('task-list');if(!list)return;
  const items=getDT();
  if(!items.length){list.innerHTML='<div class="empty-st"><svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="opacity:.4"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg><div style="font-size:12px">업무가 없습니다</div></div>';return;}
  /* 카테고리별 그룹핑 */
  const groups={};
  items.forEach(t=>{const cat=t.category||'기타';if(!groups[cat])groups[cat]=[];groups[cat].push(t);});
  const catColors={'일본 관련 업무':'#4F6EF7','인사행정 업무':'#1D9E75','해외마케팅':'#D85A30','기획/전략':'#8B5CF6','기타':'#9E9A93'};
  let html='';
  Object.entries(groups).forEach(([cat,ts])=>{
    const col=catColors[cat]||'#9E9A93';
    const done=ts.filter(t=>t.status==='완료').length;
    html+=`<div style="margin-bottom:4px">
      <div style="display:flex;align-items:center;gap:7px;padding:6px 4px 4px">
        <div style="width:3px;height:14px;background:${col};border-radius:2px;flex-shrink:0"></div>
        <span style="font-size:11px;font-weight:600;color:${col}">${esc(cat)}</span>
        <span style="font-size:10px;color:var(--hi)">${done}/${ts.length}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;padding-left:10px;border-left:2px solid ${col}20">
        ${ts.map(t=>taskCard(t)).join('')}
      </div>
    </div>`;
  });
  list.innerHTML=html;
}

function renderSales(){
  if(sChart){sChart.destroy();sChart=null;}
  const sd=loadSales();const m=salesMonth;
  const ca=document.getElementById('content-area');
  const totalActual=BKEYS.reduce((s,k)=>s+sd[k].months[m].actual,0);
  const totalGoal=BKEYS.reduce((s,k)=>s+sd[k].months[m].goal,0);
  const totalPct=Math.round(totalActual/totalGoal*100);
  const flagJP=`<svg width="20" height="13" viewBox="0 0 20 13" style="border-radius:2px;flex-shrink:0"><rect width="20" height="13" fill="#fff"/><rect y="4.5" width="20" height="4" fill="#BC002D"/></svg>`;
  const flagUS=`<svg width="20" height="13" viewBox="0 0 20 13" style="border-radius:2px;flex-shrink:0"><rect width="20" height="13" fill="#B22234"/><rect y="2" width="20" height="1.3" fill="#fff"/><rect y="5.3" width="20" height="1.3" fill="#fff"/><rect y="8.6" width="20" height="1.3" fill="#fff"/><rect y="11.8" width="20" height="1.3" fill="#fff"/><rect width="8" height="7" fill="#3C3B6E"/></svg>`;

  const branchCards=BKEYS.map(k=>{
    const b=sd[k].months[m];const bi=BI[k];
    const pct=Math.round(b.actual/b.goal*100);
    const rc=pct>=100?'over':pct>=80?'near':'under';
    const flag=k==='ny'?flagUS:flagJP;
    const isOpen=openEditKey===k;
    const rows=[
      {label:'판매 수량',val:b.qty.toLocaleString(),unit:'건'},
      {label:'단가',val:fmtW(b.price*10000),unit:''},
      {label:'실적 총액',val:fmtW(b.actual*10000),unit:'',bold:true,col:bi.color},
      {label:'목표 수량',val:b.gQty.toLocaleString(),unit:'건'},
      {label:'목표 단가',val:fmtW(b.gPrice*10000),unit:''},
      {label:'목표 매출',val:fmtW(b.goal*10000),unit:'',bold:true},
    ].map((r,i)=>`<div class="bc-row" style="background:${i%2===0?'var(--bg-card)':'var(--bg-page)'}"><span class="bc-row-label">${r.label}</span><span class="bc-row-val" style="${r.bold?'font-weight:600;':''}${r.col?'color:'+r.col+';':''}">${r.val}${r.unit?'<span class="bc-row-unit">'+r.unit+'</span>':''}</span></div>`).join('');
    const editPanel=isOpen?`<div class="edit-panel">
      <div style="font-size:11px;font-weight:500;color:var(--mu);margin-bottom:8px">실적 입력</div>
      <div class="edit-grid"><div class="edit-field"><div class="edit-label">판매 수량 (건)</div><input class="edit-input" id="a-qty-${k}" type="number" value="${b.qty}" oninput="calcAuto('${k}')"/></div><div class="edit-field"><div class="edit-label">단가 (만원)</div><input class="edit-input" id="a-price-${k}" type="number" value="${b.price}" oninput="calcAuto('${k}')"/></div></div>
      <div class="auto-result actual"><span style="font-size:10px;font-weight:500;color:var(--ca)">실적 총액 자동계산</span><span style="font-size:13px;font-weight:500;color:var(--ca)" id="a-auto-${k}">${b.actual.toLocaleString()} 만원</span></div>
      <div style="font-size:11px;font-weight:500;color:var(--mu);margin-bottom:8px">목표 입력</div>
      <div class="edit-grid"><div class="edit-field"><div class="edit-label">목표 수량 (건)</div><input class="edit-input" id="g-qty-${k}" type="number" value="${b.gQty}" oninput="calcGoal('${k}')"/></div><div class="edit-field"><div class="edit-label">목표 단가 (만원)</div><input class="edit-input" id="g-price-${k}" type="number" value="${b.gPrice}" oninput="calcGoal('${k}')"/></div></div>
      <div class="auto-result goal" style="margin-bottom:12px"><span style="font-size:10px;font-weight:500;color:var(--mu)">목표 총액 자동계산</span><span style="font-size:13px;font-weight:500;color:var(--tx)" id="g-auto-${k}">${b.goal.toLocaleString()} 만원</span></div>
      <div style="display:flex;gap:7px;justify-content:flex-end">
        <button style="padding:7px 14px;background:var(--bg-card);border:1px solid var(--cb);border-radius:var(--r);font-size:12px;cursor:pointer;color:var(--mu)" onclick="openEditKey=null;renderSales()">취소</button>
        <button style="padding:7px 16px;background:var(--ca);color:#fff;border:none;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer" onclick="saveSalesEdit('${k}',${m})">저장</button>
      </div>
    </div>`:`<div class="bc-edit-trigger" onclick="openEditKey='${k}';renderSales()"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>편집</div>`;
    return`<div class="bc"><div class="bc-head">${flag}<span class="bc-name">${bi.name}</span><span class="bc-pct-badge ${rc}">${pct}%</span></div><div class="bc-bar-wrap"><div class="bc-bar-labels"><span class="bc-bar-lbl">실적</span><div style="display:flex;align-items:baseline;gap:4px"><span style="font-size:12px;font-weight:500;color:${bi.color}">${fmtW(b.actual*10000)}</span><span style="font-size:10px;color:var(--hi)">/ ${fmtW(b.goal*10000)}</span></div></div><div class="bc-bar-track"><div class="bc-bar-fill" style="width:${Math.min(pct,100)}%;background:${bi.color}"></div></div></div><div>${rows}</div>${editPanel}</div>`;
  }).join('');

  ca.innerHTML=`<div class="chdr"><div class="ctitle" id="content-title">해외 지점 매출</div><div style="font-size:11px;color:var(--mu)">${new Date().getFullYear()}년</div></div>
  <div class="sales-outer"><div class="sales-inner">
    <div class="month-nav"><button class="mnbtn" onclick="changeS(-1)">&#8249;</button><span class="mlbl">${MN[m]}</span><button class="mnbtn" onclick="changeS(1)">&#8250;</button></div>
    <div class="sum-strip">
      <div class="sum-chip"><div class="sum-chip-lbl">합산 실적</div><div class="sum-chip-val" style="color:var(--ca);font-size:13px">${fmtM(totalActual*10000)}</div></div>
      <div class="sum-chip"><div class="sum-chip-lbl">합산 목표</div><div class="sum-chip-val" style="font-size:13px">${fmtM(totalGoal*10000)}</div></div>
      <div class="sum-chip"><div class="sum-chip-lbl">달성률</div><div class="sum-chip-val" style="color:${totalPct>=100?'#2D7A3A':totalPct>=80?'#8A6200':'#B02A1A'}">${totalPct}%</div></div>
    </div>
    ${branchCards}
    <div class="chart-box">
      <div style="font-size:11px;font-weight:500;color:var(--mu);margin-bottom:8px">월별 실적 추이 (원)</div>
      <div class="leg-row">
        <span class="leg-item"><span class="leg-dot" style="background:#4F6EF7"></span>나고야</span>
        <span class="leg-item"><span class="leg-dot" style="background:#1D9E75;border-radius:50%"></span>도쿄</span>
        <span class="leg-item"><span class="leg-dot" style="background:#D85A30;height:4px;border-radius:2px"></span>뉴욕</span>
      </div>
      <div id="chart-wrap" style="position:relative;width:100%;height:200px">
        <canvas id="sChart" role="img" aria-label="월별 실적 꺾은선 차트">나고야 도쿄 뉴욕 월별 매출</canvas>
      </div>

function closePTaskModal(e){if(!e||e.target.id==='ptask-modal-bg'){document.getElementById('ptask-modal-bg').classList.remove('open');}}
function savePTask(){
  const name=document.getElementById('ptm-name').value.trim();if(!name)return;
  const linkTaskId=document.getElementById('ptm-link-task').value||null;
  const linkedTask=linkTaskId?tasks.find(x=>String(x.id)===String(linkTaskId)):null;
  const obj={
    id:editPTaskId||'pt'+Date.now(),
    name,
    date:document.getElementById('ptm-date').value,
    status:linkedTask?linkedTask.status:(document.getElementById('ptm-status').value),
    pct:linkedTask?linkedTask.pct:Number(document.getElementById('ptm-pct').value),
    linkTaskId:linkTaskId?Number(linkTaskId)||linkTaskId:null,
    notes:document.getElementById('ptm-notes').value.trim()
  };
  const pi=projects.findIndex(x=>x.id===editPTaskProjId);if(pi<0)return;
  if(!projects[pi].tasks)projects[pi].tasks=[];
  if(editPTaskId){const ti=projects[pi].tasks.findIndex(x=>x.id===editPTaskId);projects[pi].tasks[ti]=obj;}
  else projects[pi].tasks.push(obj);
  saveProjects();document.getElementById('ptask-modal-bg').classList.remove('open');renderProject();
}
function deletePTask(projId,taskId){
  const pi=projects.findIndex(x=>x.id===projId);if(pi<0)return;
  projects[pi].tasks=(projects[pi].tasks||[]).filter(t=>t.id!==taskId);
  saveProjects();renderProject();
}
function togglePTask(projId,taskId){
  const pi=projects.findIndex(x=>x.id===projId);if(pi<0)return;
  const t=(projects[pi].tasks||[]).find(x=>x.id===taskId);if(!t)return;
  if(t.linkTaskId){
    const linked=tasks.find(x=>String(x.id)===String(t.linkTaskId));
    if(linked){linked.status=linked.status==='완료'?'대기':'완료';linked.pct=linked.status==='완료'?100:linked.pct;save();}
  }else{
    t.status=t.status==='완료'?'대기':'완료';t.pct=t.status==='완료'?100:t.pct;
  }
  saveProjects();renderProject();
}

    }).join('')}
  </div>`:''

  const notesItems=reportDay.filter(t=>t.notes).map(t=>`<div style="font-size:11px;line-height:1.6;padding:5px 0;border-bottom:1px solid var(--cb);color:var(--mu)"><div style="font-weight:500;color:var(--tx);font-size:11px;margin-bottom:1px">${esc(t.name)}</div><div>${esc(t.notes)}</div></div>`).join('');

  const ca=document.getElementById('content-area');

  <div style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;align-items:center;background:var(--bg-page)">
    <div style="width:100%;max-width:480px">
      <div style="margin-bottom:14px">
        <div style="font-size:15px;font-weight:500;margin-bottom:2px;color:var(--tx)">${dt===todayStr()?'오늘':dt.replace(/-/g,'.')} 업무 현황</div>
        <div style="font-size:11px;color:var(--mu)">${fd}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px">
        <div class="sm"><div class="sm-label">전체</div><div class="sm-val">${day.length}</div></div>
        <div class="sm"><div class="sm-label">완료</div><div class="sm-val" style="color:#2D7A3A">${done}</div></div>
        <div class="sm"><div class="sm-label">진행 중</div><div class="sm-val" style="color:var(--ca)">${prog}</div></div>
        <div class="sm"><div class="sm-label">평균 진행률</div><div class="sm-val">${avg}%</div></div>
      </div>
      ${projSection}
      <div style="margin-bottom:14px;background:var(--bg-card);border:1px solid var(--cb);border-radius:var(--rl);padding:12px 14px">

      <div style="background:var(--bg-card);border:1px solid var(--cb);border-radius:var(--rl);padding:12px 14px">

        <div id="ai-summary"><div style="display:flex;align-items:center;gap:8px;color:var(--mu);font-size:12px;padding:10px 0"><div style="display:flex;gap:4px"><span style="width:5px;height:5px;border-radius:50%;background:var(--ca);animation:dp 1.2s 0s ease-in-out infinite;display:inline-block"></span><span style="width:5px;height:5px;border-radius:50%;background:var(--ca);animation:dp 1.2s .2s ease-in-out infinite;display:inline-block"></span><span style="width:5px;height:5px;border-radius:50%;background:var(--ca);animation:dp 1.2s .4s ease-in-out infinite;display:inline-block"></span></div><span>분석 중...</span></div></div>
      </div>
    </div>
  </div>`;
  genAI(day,done,prog,wait,avg,fd);
}
async function genAI(day,done,prog,wait,avg,fd){
  const el=document.getElementById('ai-summary');if(!el)return;
  if(!day.length){el.innerHTML='<div class="ai-box">등록된 업무가 없어 분석할 내용이 없습니다.</div>';return;}

  /* ── Gemini API 키 설정 ────────────────────────────────────────
     무료 키 발급: https://aistudio.google.com/app/apikey
     발급 후 아래 빈 따옴표 안에 붙여넣으세요.
     예) const GEMINI_KEY = 'AIzaSy...';
  ──────────────────────────────────────────────────────────────── */
  const GEMINI_KEY = 'AIzaSyArHnRHiGrJNY87K4qHUQ23QDuCZcLGv7s';

  if(!GEMINI_KEY){
    el.innerHTML=`<div class="ai-box" style="border-left-color:#E8C97A;background:#FFF8E6;color:#7A5C00">
      <strong style="display:block;margin-bottom:6px">Gemini API 키 설정 필요</strong>
      Google AI Studio에서 <strong>무료로</strong> 키를 발급받아<br>
      파일 내 <code style="background:rgba(0,0,0,0.08);padding:1px 5px;border-radius:3px">GEMINI_KEY</code> 변수에 입력해 주세요.<br>
      <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:#4F6EF7;margin-top:6px;display:inline-block;font-weight:500">→ 무료 키 발급받기 (Google AI Studio)</a>
    </div>`;
    return;
  }

  const ts=day.map(t=>`- [${t.status}] ${t.name} (진행률 ${t.pct}%)${t.notes?' / 특이사항: '+t.notes:''}`).join('\n');
  const prompt=`${fd} 업무 현황: 총 ${day.length}건, 완료 ${done}건, 진행 중 ${prog}건, 대기 ${wait}건, 평균 진행률 ${avg}%.\n\n${ts}\n\n위 데이터를 바탕으로 오늘 업무 진행 상황에 대한 종합 분석을 3~4문장으로 작성해 주세요. 잘한 점, 주의할 점, 내일을 위한 제언을 포함해 전문적인 보고서 어투로 작성해 주세요. 한국어로 답변해 주세요.`;

  try{
    const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;
    const r=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:600,temperature:0.7}})
    });
    if(!r.ok){
      const err=await r.json().catch(()=>({}));
      throw new Error(err.error?.message||'HTTP '+r.status);
    }
    const data=await r.json();
    const txt=data.candidates?.[0]?.content?.parts?.[0]?.text||'분석 결과를 가져올 수 없습니다.';
    if(el)el.innerHTML=`<div class="ai-box">${txt.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</div>`;
  }catch(e){
    if(el)el.innerHTML=`<div class="ai-box" style="color:var(--mu)">
      AI 분석 오류: ${esc(e.message||'네트워크 오류')}<br>
      <span style="font-size:10px;margin-top:4px;display:block">API 키와 인터넷 연결 상태를 확인해 주세요.</span>
    </div>`;
  }
}
function copyRpt(){
  const dt=getDD();const day=tasks.filter(t=>t.date===dt);
  const done=day.filter(t=>t.status==='완료').length;const prog=day.filter(t=>t.status==='진행 중').length;
  const avg=day.length?Math.round(day.reduce((s,t)=>s+Number(t.pct),0)/day.length):0;
  const d=new Date(dt+'T00:00:00');const ds=['일','월','화','수','목','금','토'];
  const fd=d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+ds[d.getDay()]+')';
  let txt=`[일일 업무 보고서] ${fd}\n${'='.repeat(36)}\n전체 ${day.length}건 | 완료 ${done} | 진행 ${prog} | 평균 ${avg}%\n\n`;
  // 카테고리별
  const catGroups={};day.filter(t=>t.inReport!==false).forEach(t=>{const c=t.category||'기타';if(!catGroups[c])catGroups[c]=[];catGroups[c].push(t);});
  Object.entries(catGroups).forEach(([cat,ts])=>{txt+=`[${cat}]\n`;ts.forEach(t=>{txt+=`  • [${t.status}] ${t.name} (${t.pct}%)\n`;if(t.notes)txt+=`    └ ${t.notes}\n`;});txt+='\n';});
  // 프로젝트 연결
  const plinks=[];projects.forEach(p=>{(p.tasks||[]).forEach(pt=>{if(pt.date===dt)plinks.push(`  • [${p.name}] ${pt.name} - ${pt.status} (${pt.pct}%)`);});});
  if(plinks.length)txt+=`[프로젝트 연결 업무]\n${plinks.join('\n')}\n\n`;
  const ai=document.getElementById('ai-summary');if(ai){const at=ai.innerText||'';if(at&&!at.includes('분석 중'))txt+=`[AI 분석]\n${at}\n`;}
  navigator.clipboard.writeText(txt).then(()=>{const btn=document.querySelector('.chdr button');if(btn){const o=btn.innerHTML;btn.textContent='완료!';setTimeout(()=>{btn.innerHTML=o;},2000);}}).catch(()=>{});
}

function rebuildBoard(){const ca=document.getElementById('content-area');ca.innerHTML=`<div class="chdr"><div class="ctitle" id="content-title"></div><div style="display:flex;gap:6px;align-items:center"><select class="fi" style="width:auto;padding:4px 8px;font-size:11px" onchange="filterTasks(this.value)"><option value="all">전체</option><option value="대기">대기</option><option value="진행 중">진행 중</option><option value="완료">완료</option></select></div></div><div class="tlist" id="task-list"></div><div class="mpanel" id="modal-panel"><div class="minner"><div class="mtbar"><div class="mtitle" id="modal-title">새 업무 추가</div><button class="mcls" onclick="closeModal()">&#215;</button></div><div class="fg"><div class="fl">업무명</div><div class="vrow"><input class="fi" id="inp-name" placeholder="업무 내용을 입력하세요"/><button class="mic" id="mic-btn" onclick="toggleVoice('inp-name')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="21" x2="12" y2="17"/><line x1="8" y1="21" x2="16" y2="21"/></svg></button></div></div><div class="fg"><div class="fl">카테고리</div><select class="fi" id="inp-category"><option value="기타">기타</option><option value="일본 관련 업무">일본 관련 업무</option><option value="인사행정 업무">인사행정 업무</option><option value="해외마케팅">해외마케팅</option><option value="기획/전략">기획/전략</option></select></div><div class="frow"><div class="fg"><div class="fl">상태</div><select class="fi" id="inp-status"><option>대기</option><option>진행 중</option><option>완료</option></select></div><div class="fg"><div class="fl">마감일</div><input class="fi" type="date" id="inp-date"/></div></div><div class="fg"><div class="fl">진행률 — <span id="pct-label">0</span>%</div><div class="rw"><input type="range" min="0" max="100" step="5" value="0" id="inp-pct" oninput="document.getElementById('pct-label').textContent=this.value"/></div></div><div class="fg"><div class="fl">특이사항</div><div class="vrow"><textarea class="fi" id="inp-notes" rows="3" placeholder="메모, 이슈, 진행 내용..." style="resize:none;line-height:1.5"></textarea><button class="mic" id="mic-btn2" onclick="toggleVoice('inp-notes')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="21" x2="12" y2="17"/><line x1="8" y1="21" x2="16" y2="21"/></svg></button></div></div><div class="fg" style="flex-direction:row;align-items:center;gap:8px;margin-bottom:8px"><input type="checkbox" id="inp-in-report" style="width:14px;height:14px;accent-color:var(--ca)"/><label for="inp-in-report" style="font-size:11px;color:var(--mu);cursor:pointer">보고서에 포함</label></div></div><div class="mftr"><button class="btn-save-big" id="save-btn" onclick="saveTask()"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>업무 등록</button><button class="bcnl" onclick="closeModal()">취소</button></div></div>`;}

function sv(v){curView=v;if(sChart&&v!=='sales'){sChart.destroy();sChart=null;}document.querySelectorAll('.tab').forEach((b,i)=>{b.classList.toggle('active',['board','timeline','project','sales','report'].indexOf(v)===i);});document.getElementById('sidebar').classList.toggle('hidden',v==='sales'||v==='project');if(v==='board'||v==='timeline')rebuildBoard();render();}

function openModal(id){editId=id||null;const p=document.getElementById('modal-panel');if(!p)return;const t=document.getElementById('modal-title');if(t)t.textContent=id?'업무 수정':'새 업무 추가';const sb=document.getElementById('save-btn');if(sb)sb.innerHTML='<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'+(id?'수정 저장':'업무 등록');if(id){const tk=tasks.find(x=>x.id===id);document.getElementById('inp-name').value=tk.name;document.getElementById('inp-category').value=tk.category||'기타';document.getElementById('inp-status').value=tk.status;document.getElementById('inp-date').value=tk.date||'';document.getElementById('inp-pct').value=tk.pct;document.getElementById('pct-label').textContent=tk.pct;document.getElementById('inp-notes').value=tk.notes||'';document.getElementById('inp-in-report').checked=!!tk.inReport;}else{document.getElementById('inp-name').value='';document.getElementById('inp-category').value='기타';document.getElementById('inp-status').value='대기';document.getElementById('inp-date').value=getDD();document.getElementById('inp-pct').value=0;document.getElementById('pct-label').textContent=0;document.getElementById('inp-notes').value='';document.getElementById('inp-in-report').checked=true;}p.classList.add('open');setTimeout(()=>{const n=document.getElementById('inp-name');if(n)n.focus();},230);}

function closeModal(){const p=document.getElementById('modal-panel');if(p)p.classList.remove('open');stopVoice();}
function saveTask(){const name=document.getElementById('inp-name').value.trim();if(!name)return;const obj={id:editId||Date.now(),name,category:document.getElementById('inp-category').value||'기타',status:document.getElementById('inp-status').value,date:document.getElementById('inp-date').value||todayStr(),pct:Number(document.getElementById('inp-pct').value),notes:document.getElementById('inp-notes').value.trim(),inReport:document.getElementById('inp-in-report').checked};if(editId){const i=tasks.findIndex(t=>t.id===editId);tasks[i]=obj;}else tasks.unshift(obj);save();closeModal();render();}
function deleteTask(id){if(confirm('삭제할까요?')){tasks=tasks.filter(t=>t.id!==id);save();render();}}
function toggleDone(id){const t=tasks.find(x=>x.id===id);if(t.status==='완료'){t.status='대기';t.pct=0;}else{t.status='완료';t.pct=100;}save();render();}
function toggleVoice(fId){if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){alert('Chrome을 사용해주세요.');return;}if(recognition&&listeningField===fId){stopVoice();return;}stopVoice();listeningField=fId;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='ko-KR';recognition.continuous=true;recognition.interimResults=true;const mb=document.getElementById(fId==='inp-name'?'mic-btn':'mic-btn2');if(mb)mb.classList.add('on');recognition.onresult=(e)=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;const f=document.getElementById(fId);if(f)f.value=(f.value+t).trim();};recognition.onerror=()=>stopVoice();recognition.onend=()=>stopVoice();recognition.start();}
function stopVoice(){if(recognition){try{recognition.stop();}catch(e){}recognition=null;}document.querySelectorAll('.mic').forEach(b=>b.classList.remove('on'));listeningField=null;}
